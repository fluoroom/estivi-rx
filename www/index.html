<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>estivi rx</title>
  <meta name="theme-color" content="#101010">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="estivi rx">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>estivi rx</h1>
    <div class="clock" id="clock" data-i18n-title="clock.title" title="Local time with seconds, UTC underneath">
      <span id="clock-local">--:--:--</span>
      <span id="clock-utc">UTC --:--:--</span>
    </div>
    <label class="field">
      <span data-i18n="field.device">Device</span>
      <select id="device">
        <option value="" data-i18n="device.default">Default</option>
      </select>
    </label>
    <label class="field">
      <span data-i18n="field.channel">Channel</span>
      <select id="channel">
        <option value="mono" data-i18n="channel.mono">Mono</option>
        <option value="left" data-i18n="channel.left">Left</option>
        <option value="right" data-i18n="channel.right">Right</option>
      </select>
    </label>
    <label class="field">
      <span data-i18n="field.gain">Input gain</span>
      <span class="inline">
        <input id="gain" type="range" min="-12" max="36" step="0.5" value="0">
        <span id="gain-out">0 dB</span>
      </span>
    </label>
    <div class="field vu">
      <span data-i18n="field.level">Level</span>
      <span class="inline">
        <div id="vu-bar"></div>
        <span id="vu-read">—</span>
      </span>
    </div>
    <label class="field">
      <span data-i18n="field.mode">SSTV mode</span>
      <select id="mode">
        <option value="auto" data-i18n="mode.auto">Auto</option>
      </select>
    </label>
    <button type="button" id="run" data-i18n="run.start">Start receiving</button>
    <button type="button" id="theme" data-i18n="theme.toLight">Light</button>
    <label class="field">
      <span data-i18n="field.language">Language</span>
      <select id="lang">
        <option value="auto" data-i18n="lang.auto">Auto</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </label>
  </header>
  <p id="err" hidden></p>
  <main>
    <section class="visor">
      <div class="stage" id="stage">
      <div class="picture" id="picture">
        <canvas id="live" width="320" height="256"></canvas>
        <canvas id="noise" width="320" height="256" hidden></canvas>
        <img id="still" alt="" hidden>
      </div>
      </div>
      <div class="bar">
        <div class="name" id="name"><span class="name-text" id="name-text"></span><span class="name-mode" id="name-mode"></span></div>
        <button type="button" id="scale-mode" data-i18n-title="scale.title" data-i18n-aria="scale.title" title="Resize style" aria-label="Resize style">Pixels</button>
        <button type="button" id="save" data-i18n="action.save">Save</button>
        <button type="button" id="delete" data-i18n="action.delete" hidden>Delete</button>
        <button type="button" id="full" data-i18n="action.fullscreen">Fullscreen</button>
        <button type="button" id="reset" data-i18n="action.reset">Reset</button>
        <button type="button" id="install" data-i18n="action.install" hidden>Install app</button>
      </div>
    </section>
    <div class="timeline-row">
      <div class="scroller" id="timeline"></div>
      <button type="button" id="clear" data-i18n="clear.images">Clear image memory</button>
    </div>
    <div class="guide">
      <div class="hours">
        <div class="axis-row">
          <div class="axis" id="axis"></div>
        </div>
        <div id="lanes"></div>
        <div id="marks" class="marks"></div>
      </div>
      <div class="guide-actions">
        <button type="button" id="cal" data-i18n="calendar.title">Calendar</button>
        <button type="button" id="clear-cal" data-i18n="calendar.clear">Clear calendar</button>
      </div>
    </div>
  </main>
  <footer><a href="https://lu1aqy.radio">LU1AQY 2026</a></footer>
  <dialog id="calendar">
    <div class="dialog-bar">
      <h2 data-i18n="calendar.title">Calendar</h2>
      <button type="button" id="close-cal" data-i18n="calendar.close">Close</button>
    </div>
    <div id="cal-body"></div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
