server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /dgt/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $recovery http://recovery:8090;
        proxy_pass $recovery;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
